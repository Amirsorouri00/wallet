name: taline-wallet-ledger

x-application: &application
  image: taline-wallet-ledger:local
  build:
    context: .
    dockerfile: build/Dockerfile
  init: true
  environment:
    APP_NAME: Taline Wallet Ledger
    APP_ENV: local
    APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    APP_DEBUG: "false"
    APP_URL: http://localhost:8000
    LOG_CHANNEL: stderr
    LOG_LEVEL: info
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: taline_wallet_ledger
    DB_USERNAME: postgres
    DB_PASSWORD: postgres
    DB_TIMEZONE: UTC
    DB_APPLICATION_NAME: taline-wallet-ledger-docker
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    GATEWAY_SECRET: local-docker-gateway-secret

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: taline_wallet_ledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taline_wallet_ledger"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  migrate:
    <<: *application
    command:
      - sh
      - -euc
      - php artisan migrate --force --no-interaction && php artisan db:seed --force --no-interaction
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *application
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1:8000/api/health') === false ? 1 : 0);"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  outbox-worker:
    <<: *application
    command: ["php", "artisan", "outbox:work", "--sleep=1000", "--batch=100"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
